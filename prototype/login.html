<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"></head><body><div data-site-header></div><main class="auth-wrap"><section class="auth-side"><p class="eyebrow">Selamat datang kembali</p><h1 class="title">Kelola kebutuhan hunian dalam satu akun.</h1><p style="color:#ffffffbf;max-width:570px">Lihat booking, pembayaran, invoice, dan laporan Anda melalui dashboard.</p></section><section class="auth-panel"><div class="auth-box"><h2 class="section-title">Login</h2><p class="muted" style="margin-bottom:30px">Masukkan email dan password akun Anda.</p><div data-alert class="hidden"></div><form class="form" data-form novalidate><div class="field"><label>Email</label><input type="email" name="email" placeholder="nama@email.com"><span class="field-error"></span></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="Masukkan password"><span class="field-error"></span></div><div style="display:flex;justify-content:space-between;gap:15px;font-size:14px"><label><input type="checkbox" name="remember"> Ingat saya</label><a href="lupa-password.html" style="color:#1da1f2;font-weight:600">Lupa password?</a></div><div class="field"><label>Simulasi role</label><select name="role"><option value="tenant">Tenant</option><option value="owner">Owner</option></select><span class="field-error"></span></div><button class="btn btn-dark" type="submit">Login</button></form><p class="muted" style="text-align:center;margin-top:24px">Belum punya akun? <a href="registrasi.html" style="color:#1da1f2;font-weight:700">Daftar tenant</a></p><p class="muted" style="font-size:12px;text-align:center">Gunakan password <strong>salah123</strong> untuk melihat error state.</p></div></section></main><script src="prototype-common.js"></script><script>
const f=document.querySelector('[data-form]'),a=document.querySelector('[data-alert]');f.onsubmit=e=>{e.preventDefault();const em=f.email,p=f.password;proto.error(em,proto.email(em.value)?'':'Format email tidak valid');proto.error(p,p.value?'':'Password wajib diisi');if(!proto.email(em.value)||!p.value)return;a.classList.add('hidden');const b=f.querySelector('button');proto.wait(b,'Login...');setTimeout(()=>{proto.done(b);if(p.value==='salah123'){a.className='alert alert-error';a.textContent='Email atau password salah. Silakan periksa kembali.';return}a.className='alert alert-success';a.textContent=`Login berhasil. Mengarahkan ke dashboard ${f.role.value} (simulasi).`;setTimeout(()=>location.hash=`dashboard-${f.role.value}`,600)},700)};
</script></body></html>

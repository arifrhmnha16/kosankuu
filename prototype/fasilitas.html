<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fasilitas - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"></head><body data-page="fasilitas"><div data-site-header></div><main><section class="hero"><div class="shell"><p class="eyebrow">Fasilitas properti</p><h1 class="title">Fasilitas untuk kebutuhan sehari-hari.</h1><p class="lead">Ketersediaan fasilitas dapat berbeda menurut tipe kamar. Periksa halaman detail kamar sebelum melakukan booking.</p></div></section><section class="section"><div class="shell" data-facilities></div></section></main><div data-site-footer></div><script src="prototype-common.js"></script><script>
const categories=[{name:'Fasilitas umum',items:[['Wi-Fi','Koneksi internet area kamar dan bersama'],['Dapur bersama','Area memasak bersama'],['Area parkir','Untuk kendaraan penghuni'],['Ruang bersama','Area duduk dan bersantai']]},{name:'Fasilitas kamar',items:[['AC','Tersedia pada kamar tertentu'],['Kamar mandi dalam','Sesuai tipe kamar'],['Meja kerja','Meja dan kursi pribadi'],['Lemari','Penyimpanan pakaian']]},{name:'Keamanan',items:[['CCTV','Pemantauan area umum'],['Akses 24 jam','Akses penghuni terdaftar'],['Petugas pengelola','Pada jam operasional']]},{name:'Kebersihan',items:[['Area laundry','Tempat mencuci dan menjemur'],['Tempat sampah terpilah','Di area yang ditentukan'],['Pembersihan area umum','Sesuai jadwal pengelola']]},{name:'Fasilitas tambahan',items:[]}];
document.querySelector('[data-facilities]').innerHTML=categories.map(c=>`<section style="margin-bottom:58px"><p class="eyebrow">${c.name}</p>${c.items.length?`<div class="grid g4">${c.items.map((x,i)=>`<article class="card soft"><div class="icon">${String(i+1).padStart(2,'0')}</div><h3>${x[0]}</h3><p class="muted">${x[1]}</p></article>`).join('')}</div>`:`<div class="empty"><h3>Belum ada fasilitas pada kategori ini</h3><p class="muted">Informasi akan ditambahkan setelah fasilitas tersedia.</p></div>`}</section>`).join('');
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lupa Password - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"></head><body><div data-site-header></div><main class="auth-wrap"><section class="auth-side"><p class="eyebrow">Pemulihan akun</p><h1 class="title">Atur ulang akses akun Anda.</h1><p style="color:#ffffffbf">Kami akan mensimulasikan pengiriman instruksi reset ke alamat email yang dimasukkan.</p></section><section class="auth-panel"><div class="auth-box"><h2 class="section-title">Lupa password</h2><p class="muted" style="margin-bottom:28px">Masukkan email Anda. Pesan hasil tidak akan mengonfirmasi apakah email terdaftar.</p><div data-alert class="hidden"></div><form class="form" data-form novalidate><div class="field"><label>Email</label><input name="email" type="email" placeholder="nama@email.com"><span class="field-error"></span></div><button class="btn btn-dark">Kirim Instruksi Reset</button></form><a href="login.html" style="display:block;text-align:center;margin-top:24px;color:#1da1f2;font-weight:700">← Kembali ke Login</a></div></section></main><script src="prototype-common.js"></script><script>
const f=document.querySelector('[data-form]'),a=document.querySelector('[data-alert]');f.onsubmit=e=>{e.preventDefault();proto.error(f.email,proto.email(f.email.value)?'':'Format email tidak valid');if(!proto.email(f.email.value))return;const b=f.querySelector('button');proto.wait(b,'Mengirim...');setTimeout(()=>{proto.done(b);a.className='alert alert-success';a.textContent='Jika email tersebut terhubung ke akun, instruksi reset telah dikirim (simulasi).'},700)};
</script></body></html>

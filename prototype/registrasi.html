<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrasi Tenant - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"></head><body><div data-site-header></div><main class="auth-wrap"><section class="auth-side"><p class="eyebrow">Registrasi tenant</p><h1 class="title">Buat akun untuk mulai booking.</h1><p style="color:#ffffffbf;max-width:560px">Akun digunakan untuk mengirim booking, menyimpan invoice, dan mengelola kebutuhan selama tinggal.</p></section><section class="auth-panel"><div class="auth-box"><h2 class="section-title">Daftar tenant</h2><div data-alert class="hidden"></div><form class="form" data-form novalidate><div class="field"><label>Nama lengkap</label><input name="name"><span class="field-error"></span></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="nama@email.com"><span class="field-error"></span></div><div class="field"><label>Nomor WhatsApp</label><input name="phone" placeholder="08xxxxxxxxxx"><span class="field-error"></span></div><div class="grid g2"><div class="field"><label>Password</label><input name="password" type="password"><span class="field-error"></span></div><div class="field"><label>Konfirmasi password</label><input name="confirm" type="password"><span class="field-error"></span></div></div><div class="field"><label><input name="terms" type="checkbox"> Saya menyetujui syarat dan kebijakan privasi.</label><span class="field-error"></span></div><button class="btn btn-dark" type="submit">Buat Akun</button></form><p class="muted" style="text-align:center;margin-top:22px">Sudah punya akun? <a href="login.html" style="color:#1da1f2;font-weight:700">Login</a></p><p class="muted" style="font-size:12px;text-align:center">Gunakan email <strong>terdaftar@example.com</strong> untuk error state.</p></div></section></main><script src="prototype-common.js"></script><script>
const f=document.querySelector('[data-form]'),a=document.querySelector('[data-alert]');f.onsubmit=e=>{e.preventDefault();const ok={name:!!f.name.value.trim(),email:proto.email(f.email.value),phone:/^08\d{8,13}$/.test(f.phone.value),password:f.password.value.length>=8,confirm:f.confirm.value===f.password.value&&!!f.confirm.value,terms:f.terms.checked};proto.error(f.name,ok.name?'':'Nama wajib diisi');proto.error(f.email,ok.email?'':'Format email tidak valid');proto.error(f.phone,ok.phone?'':'Nomor WhatsApp tidak valid');proto.error(f.password,ok.password?'':'Password minimal 8 karakter');proto.error(f.confirm,ok.confirm?'':'Konfirmasi password tidak sama');proto.error(f.terms,ok.terms?'':'Persetujuan wajib dicentang');if(Object.values(ok).includes(false))return;a.classList.add('hidden');const b=f.querySelector('button');proto.wait(b,'Membuat akun...');setTimeout(()=>{proto.done(b);if(f.email.value.toLowerCase()==='terdaftar@example.com'){a.className='alert alert-error';a.textContent='Email sudah terdaftar. Silakan login atau gunakan email lain.';return}a.className='alert alert-success';a.textContent='Akun tenant berhasil dibuat (simulasi). Anda dapat melanjutkan ke halaman login.'},750)};
</script></body></html>

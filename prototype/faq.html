<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"></head><body><div data-site-header></div><main><section class="hero"><div class="shell"><p class="eyebrow">Pertanyaan umum</p><h1 class="title">Ada yang ingin ditanyakan?</h1><p class="lead">Cari informasi seputar booking, pembayaran, pembatalan, aturan kos, dan akun.</p><input data-search class="search" style="max-width:720px;margin-top:28px;padding:17px 20px" placeholder="Cari pertanyaan..."></div></section><section class="section"><div class="shell" style="max-width:900px" data-list></div><div class="shell hidden" data-empty><div class="empty"><h3>Pertanyaan tidak ditemukan</h3><p class="muted">Coba gunakan kata kunci lain.</p><button class="btn btn-dark" data-reset>Reset Pencarian</button></div></div></section></main><div data-site-footer></div><script src="prototype-common.js"></script><script>
const data={Booking:[['Bagaimana cara booking kamar?','Pilih kamar dan jadwal, periksa ringkasan, lalu kirim permintaan setelah login.'],['Apakah booking langsung diterima?','Booking diperiksa untuk memastikan kamar dan jadwal masih tersedia.']],Pembayaran:[['Metode pembayaran apa yang tersedia?','Pembayaran dapat dilakukan secara online atau transfer manual.'],['Apakah saya menerima invoice?','Invoice dibuat setelah pembayaran tercatat dan dapat dilihat di akun.']],Pembatalan:[['Apakah booking dapat dibatalkan?','Pembatalan mengikuti kebijakan properti dan status booking.'],['Apakah pembayaran dapat dikembalikan?','Pengembalian dana bergantung pada waktu pembatalan dan kebijakan yang berlaku.']],['Aturan Kos']:[['Apakah tamu diperbolehkan?','Tamu diperbolehkan sesuai jam dan wajib mengikuti prosedur pelaporan.'],['Apakah boleh membawa hewan?','Hewan peliharaan memerlukan persetujuan tertulis dari pengelola.']],Akun:[['Mengapa saya perlu membuat akun?','Akun digunakan untuk booking, pembayaran, invoice, dan pencatatan keluhan.'],['Bagaimana jika lupa password?','Gunakan menu lupa password pada halaman login untuk meminta instruksi reset.']]};const list=document.querySelector('[data-list]'),empty=document.querySelector('[data-empty]'),search=document.querySelector('[data-search]');function render(){const q=search.value.toLowerCase();let count=0;list.innerHTML=Object.entries(data).map(([cat,items])=>{const found=items.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));count+=found.length;return found.length?`<section style="margin-bottom:42px"><p class="eyebrow">${cat}</p>${found.map(x=>`<article class="accordion"><button><span>${x[0]}</span><span>+</span></button><div class="accordion-content">${x[1]}</div></article>`).join('')}</section>`:''}).join('');list.classList.toggle('hidden',!count);empty.classList.toggle('hidden',!!count);document.querySelectorAll('.accordion button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'))}search.oninput=render;document.querySelector('[data-reset]').onclick=()=>{search.value='';render()};render();
</script></body></html>

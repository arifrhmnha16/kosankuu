<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeri - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"><style>.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo{border:0;padding:0;border-radius:20px;overflow:hidden;background:#eee;height:240px}.photo img{width:100%;height:100%;object-fit:cover;transition:.3s}.photo:hover img{transform:scale(1.04)}dialog{border:0;padding:0;background:transparent;width:min(92vw,1100px)}dialog::backdrop{background:#111827e8}.lightbox{position:relative}.lightbox img{width:100%;max-height:82vh;object-fit:contain;background:#000;border-radius:20px}.lightbox button{position:absolute;border:0;background:#fff;width:46px;height:46px;border-radius:50%;font-size:22px}.lb-close{right:-12px;top:-12px}.lb-prev{left:14px;top:48%}.lb-next{right:14px;top:48%}@media(max-width:800px){.photos{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.photos{grid-template-columns:1fr}}</style></head><body><div data-site-header></div><main><section class="hero"><div class="shell"><p class="eyebrow">Galeri</p><h1 class="title">Lihat ruang dan suasananya.</h1><p class="lead">Foto prototype ini menjadi contoh susunan dokumentasi kamar, area umum, dan fasilitas.</p></div></section><section class="section"><div class="shell"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px" data-filters></div><div data-loading class="empty"><div class="spinner" style="margin:auto;border-color:#ddd;border-top-color:#1da1f2"></div><p>Memuat foto...</p></div><div class="photos hidden" data-photos></div><div class="empty hidden" data-empty><h3>Belum ada foto pada kategori ini</h3><p class="muted">Pilih kategori lain atau kembali lagi nanti.</p></div><div style="text-align:center;margin-top:32px"><button class="btn btn-dark hidden" data-more>Muat Lebih Banyak</button></div></div></section></main><div data-site-footer></div><dialog data-dialog><div class="lightbox"><img data-large src="" alt=""><button class="lb-close" data-close>×</button><button class="lb-prev" data-prev>‹</button><button class="lb-next" data-next>›</button></div></dialog><script src="prototype-common.js"></script><script>
const base=['1522708323590-d24dbb6b0267','1540518614846-7eded433c457','1505693314120-0d443867891c','1505693416388-ac5ce068fe85','1595526114035-0d45ed16cfbf','1566665797739-1674de7a421a','1556912172-45b7abe8b7e1','1560448204-e02f11c3d0e2','1555854877-bab0e564b8d5','1560185008-b033106af5c3','1552321554-5fefe8c9ef14','1616594039964-ae9021a400a0','1615874694520-474822394e73','1560185007-c5ca9d2c014d','1560185127-6ed189bf02f4','1618221195710-dd6b41faaea6'];const cats=['kamar','kamar','kamar','kamar','kamar','kamar','fasilitas','umum','umum','fasilitas','fasilitas','kamar','umum','fasilitas','umum','kamar'];const photos=base.map((id,i)=>({cat:cats[i],src:`https://images.unsplash.com/photo-${id}?q=85&w=1400&auto=format&fit=crop`,alt:`Foto ${cats[i]} Manzsa ${i+1}`}));let cat='semua',limit=8,current=0;const grid=document.querySelector('[data-photos]'),empty=document.querySelector('[data-empty]'),more=document.querySelector('[data-more]'),dialog=document.querySelector('[data-dialog]');const visible=()=>photos.filter(p=>cat==='semua'||p.cat===cat);
document.querySelector('[data-filters]').innerHTML=['semua','kamar','umum','fasilitas','belum ada'].map(x=>`<button class="btn ${x==='semua'?'btn-dark':'btn-line'}" data-filter="${x}">${x==='umum'?'Area umum':x[0].toUpperCase()+x.slice(1)}</button>`).join('');function render(){const list=visible();grid.innerHTML=list.slice(0,limit).map((p,i)=>`<button class="photo" data-index="${i}"><img src="${p.src}" alt="${p.alt}"></button>`).join('');grid.classList.toggle('hidden',!list.length);empty.classList.toggle('hidden',!!list.length);more.classList.toggle('hidden',list.length<=limit);document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>open(+b.dataset.index))}function open(i){current=i;const p=visible()[current];document.querySelector('[data-large]').src=p.src;document.querySelector('[data-large]').alt=p.alt;dialog.showModal()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{cat=b.dataset.filter;limit=8;document.querySelectorAll('[data-filter]').forEach(x=>x.className=`btn ${x===b?'btn-dark':'btn-line'}`);render()});more.onclick=()=>{limit+=8;render()};document.querySelector('[data-close]').onclick=()=>dialog.close();document.querySelector('[data-prev]').onclick=()=>open((current-1+visible().length)%visible().length);document.querySelector('[data-next]').onclick=()=>open((current+1)%visible().length);dialog.onclick=e=>{if(e.target===dialog)dialog.close()};setTimeout(()=>{document.querySelector('[data-loading]').classList.add('hidden');grid.classList.remove('hidden');render()},500);
</script></body></html>

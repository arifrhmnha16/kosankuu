<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - Manzsa Residence</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype-common.css"></head><body><div data-site-header></div><main class="auth-wrap"><section class="auth-side"><p class="eyebrow">Password baru</p><h1 class="title">Buat password yang aman.</h1><p style="color:#ffffffbf">Gunakan minimal delapan karakter dan hindari password yang mudah ditebak.</p></section><section class="auth-panel"><div class="auth-box"><div data-valid><h2 class="section-title">Reset password</h2><div data-alert class="hidden"></div><form class="form" data-form novalidate><div class="field"><label>Password baru</label><input name="password" type="password"><span class="field-error"></span></div><div class="field"><label>Konfirmasi password baru</label><input name="confirm" type="password"><span class="field-error"></span></div><button class="btn btn-dark">Simpan Password Baru</button></form></div><div data-expired class="hidden empty"><h2>Link reset tidak valid atau kedaluwarsa</h2><p class="muted">Minta tautan reset baru untuk melanjutkan.</p><a class="btn btn-dark" href="lupa-password.html">Minta Link Baru</a></div><button data-toggle-expired class="btn btn-line" style="margin-top:22px;width:100%">Simulasikan link kedaluwarsa</button></div></section></main><script src="prototype-common.js"></script><script>
const f=document.querySelector('[data-form]'),a=document.querySelector('[data-alert]');f.onsubmit=e=>{e.preventDefault();const p=f.password.value,c=f.confirm.value;proto.error(f.password,p.length>=8?'':'Password minimal 8 karakter');proto.error(f.confirm,c===p&&c?'':'Konfirmasi password tidak sama');if(p.length<8||c!==p)return;const b=f.querySelector('button');proto.wait(b,'Menyimpan...');setTimeout(()=>{proto.done(b);a.className='alert alert-success';a.textContent='Password berhasil diperbarui (simulasi). Anda akan diarahkan ke login.';setTimeout(()=>location.href='login.html#password-reset-success',900)},700)};let expired=false;document.querySelector('[data-toggle-expired]').onclick=e=>{expired=!expired;document.querySelector('[data-valid]').classList.toggle('hidden',expired);document.querySelector('[data-expired]').classList.toggle('hidden',!expired);e.target.textContent=expired?'Kembali ke kondisi valid':'Simulasikan link kedaluwarsa'};
</script></body></html>
